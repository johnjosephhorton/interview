name = "Mug Bargain with Cheap Talk"
description = "Bilateral mug bargaining with pre-play cheap talk, varying value gaps and information structure"

[canned]
opening_instruction = """Explain the game rules from the Game Rules section clearly so someone with no prior knowledge could understand. Include: what the game is (a price negotiation over a coffee mug), that the AI owns the mug and the human wants to buy it, the human's valuation (${{buyer_wtp}}), that the AI values the mug somewhere between ${{seller_range_lo}} and ${{seller_range_hi}} (but NOT the exact value), the alternating offer structure (seller offers on rounds 1 and 3, buyer offers on round 2), the maximum of 3 bargaining rounds plus a final accept/reject, valid price range ($0.00–$15.00), and how earnings are computed (deal at price P: seller earns P minus their cost, buyer earns ${{buyer_wtp}} minus P; no deal: both earn $0).
Then immediately present Round 1 with the seller's opening offer and ask: "Do you accept, or would you like to make a counteroffer?"

Do NOT ask if the human is ready. Do NOT add any preamble before the game. Your first message IS the game start."""
last_question = "This is the final round. Make your last decision."
end_of_session = "The bargaining session has ended. Thank you for participating."

[settings]
max_tokens = 4096
opening_max_tokens = 8192
respondent_temperature = 1

[concordia]
experiment = "mug_bargain_cheap_talk"
sim_script = "concordia_sim.py"
